# 最小化 Docker Compose 配置
# 使用外部 PostgreSQL 数据库，内置 NATS 消息队列

services:
  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    image: ghcr.io/marcoshack/taskwondo/api:${IMAGE_TAG:-latest}
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - API_PORT=8080
      - DATABASE_URL=${DATABASE_URL:?required}
      - JWT_SECRET=${JWT_SECRET:?required}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:?required}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?required}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?required}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-taskwondo-attachments}
      - STORAGE_USE_SSL=${STORAGE_USE_SSL:-true}
      - NATS_URL=nats://nats:4222
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/marcoshack/taskwondo/web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  natsdata:
