# Storage migration test stack — used only by scripts/storage-migration-test.sh.
#
# Mirrors the production `minio` service (same command, env and a persistent
# data volume) but takes the server and client images from the environment, so
# the script can write data with one object store, recreate the container with
# another image on the same volume, and check what survived.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: miguser
      POSTGRES_PASSWORD: migpass
      POSTGRES_DB: migdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miguser"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: ${STORAGE_IMAGE:?set by scripts/storage-migration-test.sh}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: migminioaccess
      MINIO_ROOT_PASSWORD: migminiosecret
    healthcheck:
      # Both MinIO and Silo server images ship `mc` with a predefined `local` alias.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    image: ${MC_IMAGE:?set by scripts/storage-migration-test.sh}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 migminioaccess migminiosecret;
      mc mb --ignore-existing local/taskwondo-attachments;
      exit 0;
      "
    restart: "no"

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment:
      API_PORT: "8080"
      DATABASE_URL: "postgres://miguser:migpass@postgres:5432/migdb?sslmode=disable"
      JWT_SECRET: "storage-migration-jwt-secret-at-least-32-chars"
      STORAGE_ENDPOINT: "minio:9000"
      STORAGE_ACCESS_KEY: "migminioaccess"
      STORAGE_SECRET_KEY: "migminiosecret"
      STORAGE_BUCKET: "taskwondo-attachments"
      STORAGE_USE_SSL: "false"
      ADMIN_EMAIL: "admin@migration.test"
      ADMIN_PASSWORD: "MigAdminPass123!"
      AUTH_RATE_LIMIT: "5000"
      AUTH_RATE_BURST: "500"
      BASE_URL: "http://localhost:18089"
      NATS_URL: "nats://nats:4222"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
    ports:
      - "127.0.0.1:${MIGRATION_API_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  miniodata:
