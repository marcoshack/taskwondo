root = "."

[build]
  cmd = "go build -o ./tmp/taskwondo-worker ./cmd/worker"
  entrypoint = "./tmp/taskwondo-worker"
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "sql"]
  # Forward SIGINT (instead of an immediate SIGKILL) so the binary runs its
  # graceful shutdown (dispatcher drain, scheduler stop, DB/NATS cleanup). air
  # returns as soon as the process exits, so kill_delay only bounds a hung
  # shutdown; keep it >= the service's 10s shutdown timeout.
  send_interrupt = true
  kill_delay = "11s"
  stop_on_error = true

[log]
  time = false
  main_only = true

[misc]
  clean_on_exit = true
  startup_banner = ""
